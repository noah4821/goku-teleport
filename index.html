

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEETINGPORT MODE</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  background: #080a0e;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

header {

  padding: 22px 12px 12px;

}

h1 {

  margin: 0;

  font-size: 25px;

  letter-spacing: 4px;

}

#status {

  color: #aaa;

  font-size: 13px;

  margin-top: 10px;

}

#screen {

  width: min(94vw, 850px);

  margin: 16px auto;

  background: #15191f;

  border: 1px solid #333b46;

  border-radius: 12px;

  overflow: hidden;

  aspect-ratio: 16 / 9;

}

canvas {

  display: block;

  width: 100%;

  height: 100%;

  object-fit: contain;

}

video {

  display: none;

}

.controls {

  display: flex;

  justify-content: center;

  flex-wrap: wrap;

  gap: 10px;

  padding: 12px;

}

button {

  border: 1px solid #444;

  background: #171c24;

  color: white;

  border-radius: 9px;

  padding: 13px 18px;

  font-size: 14px;

  font-weight: bold;

}

button:active {

  background: #343d4a;

}

#instructions {

  max-width: 500px;

  margin: 10px auto 30px;

  padding: 0 18px;

  color: #aeb5c0;

  font-size: 13px;

  line-height: 1.7;

}

#hiddenStatus {

  color: #fff;

  font-size: 14px;

  letter-spacing: 2px;

  margin: 12px;

}

</style>

</head>

<body>

<header>

  <h1>MEETINGPORT</h1>

  <div id="status">CAMERA NOT STARTED</div>

</header>

<div id="screen">

  <canvas id="output" width="1280" height="720"></canvas>

</div>

<div id="hiddenStatus">PERSON VISIBLE</div>

<div class="controls">

  <button id="start">START CAMERA</button>

  <button id="capture" disabled>CAPTURE EMPTY ROOM</button>

</div>

<div id="instructions">

  1. Start your camera and allow permission.<br>

  2. Leave the camera view, then capture the empty room.<br>

  3. Return to your position in front of the camera.<br>

  4. Show ✌️ to disappear. Show ✌️ again to reappear.

</div>

<video id="video" playsinline muted></video>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<script>

const video = document.getElementById("video");

const canvas = document.getElementById("output");

const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");

const hiddenStatus = document.getElementById("hiddenStatus");

const startButton = document.getElementById("start");

const captureButton = document.getElementById("capture");

const W = canvas.width;

const H = canvas.height;

const backgroundCanvas = document.createElement("canvas");

backgroundCanvas.width = W;

backgroundCanvas.height = H;

const backgroundCtx = backgroundCanvas.getContext("2d");

const subjectCanvas = document.createElement("canvas");

subjectCanvas.width = W;

subjectCanvas.height = H;

const subjectCtx = subjectCanvas.getContext("2d");

const maskCanvas = document.createElement("canvas");

maskCanvas.width = W;

maskCanvas.height = H;

const maskCtx = maskCanvas.getContext("2d");

let cameraStarted = false;

let backgroundReady = false;

let personHidden = false;

let gestureActive = false;

let lastGestureTime = 0;

let processing = false;

let segmentationReady = false;

let latestMask = null;

function updateStatus(message) {

  statusText.textContent = message;

}

function updateHiddenStatus() {

  hiddenStatus.textContent =

    personHidden ? "PERSON HIDDEN" : "PERSON VISIBLE";

}

function drawMirrored(source, targetCtx) {

  targetCtx.save();

  targetCtx.translate(W, 0);

  targetCtx.scale(-1, 1);

  targetCtx.drawImage(source, 0, 0, W, H);

  targetCtx.restore();

}

// MediaPipe segmentation

const segmentation = new SelfieSegmentation({

  locateFile: file =>

    `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`

});

segmentation.setOptions({

  modelSelection: 1

});

segmentation.onResults(results => {

  if (!results.segmentationMask) return;

  maskCtx.clearRect(0, 0, W, H);

  maskCtx.drawImage(results.segmentationMask, 0, 0, W, H);

  latestMask = true;

  segmentationReady = true;

});

// Hand detection

const hands = new Hands({

  locateFile: file =>

    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

});

hands.setOptions({

  maxNumHands: 1,

  modelComplexity: 1,

  minDetectionConfidence: 0.7,

  minTrackingConfidence: 0.65

});

hands.onResults(results => {

  let twoFingerGesture = false;

  if (results.multiHandLandmarks &&

      results.multiHandLandmarks.length > 0) {

    const p = results.multiHandLandmarks[0];

    const indexUp = p[8].y < p[6].y;

    const middleUp = p[12].y < p[10].y;

    const ringDown = p[16].y > p[14].y;

    const pinkyDown = p[20].y > p[18].y;

    twoFingerGesture =

      indexUp && middleUp && ringDown && pinkyDown;

  }

  const now = Date.now();

  if (

    twoFingerGesture &&

    !gestureActive &&

    now - lastGestureTime > 1200 &&

    backgroundReady

  ) {

    personHidden = !personHidden;

    lastGestureTime = now;

    updateHiddenStatus();

  }

  gestureActive = twoFingerGesture;

});

// Camera

async function startCamera() {

  try {

    updateStatus("STARTING CAMERA...");

    const stream = await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: "user",

        width: { ideal: 1280 },

        height: { ideal: 720 }

      },

      audio: false

    });

    video.srcObject = stream;

    await video.play();

    cameraStarted = true;

    captureButton.disabled = false;

    startButton.disabled = true;

    updateStatus("CAMERA READY — CAPTURE THE EMPTY ROOM");

    processFrames();

    renderLoop();

  } catch (error) {

    updateStatus("CAMERA ERROR — CHECK PERMISSIONS");

    console.error(error);

  }

}

async function processFrames() {

  if (!cameraStarted) return;

  if (video.readyState >= 2 && !processing) {

    processing = true;

    try {

      await segmentation.send({ image: video });

      await hands.send({ image: video });

    } catch (error) {

      console.error(error);

    }

    processing = false;

  }

  requestAnimationFrame(processFrames);

}

// Capture the empty room

captureButton.addEventListener("click", () => {

  if (!cameraStarted) return;

  backgroundCtx.clearRect(0, 0, W, H);

  backgroundCtx.drawImage(video, 0, 0, W, H);

  backgroundReady = true;

  personHidden = false;

  updateHiddenStatus();

  updateStatus("BACKGROUND LOCKED — SHOW ✌️ TO DISAPPEAR");

});

// Draw the frozen room and extracted person

function renderLoop() {

  requestAnimationFrame(renderLoop);

  ctx.clearRect(0, 0, W, H);

  if (!cameraStarted || !backgroundReady) {

    if (video.readyState >= 2) {

      drawMirrored(video, ctx);

    } else {

      ctx.fillStyle = "#15191f";

      ctx.fillRect(0, 0, W, H);

    }

    return;

  }

  // Always show the captured room

  drawMirrored(backgroundCanvas, ctx);

  if (personHidden || !latestMask) return;

  // Extract the person using the segmentation mask

  subjectCtx.clearRect(0, 0, W, H);

  subjectCtx.globalCompositeOperation = "source-over";

  subjectCtx.drawImage(video, 0, 0, W, H);

  subjectCtx.globalCompositeOperation = "destination-in";

  subjectCtx.drawImage(maskCanvas, 0, 0, W, H);

  subjectCtx.globalCompositeOperation = "source-over";

  drawMirrored(subjectCanvas, ctx);

}

startButton.addEventListener("click", startCamera);

</script>

</body>

</html>
