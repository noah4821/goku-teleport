

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GOKU MODE</title>

<style>

* {

  box-sizing: border-box;

}

body {

  margin: 0;

  padding: 20px;

  background: #080812;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

h1 {

  color: #a879ff;

  font-size: 38px;

  margin-bottom: 5px;

}

p {

  color: #ccc;

}

canvas {

  width: 100%;

  max-width: 640px;

  background: #222;

  border: 2px solid #8b5cf6;

  border-radius: 12px;

  margin-top: 15px;

}

button {

  display: block;

  width: 100%;

  max-width: 320px;

  margin: 12px auto;

  padding: 15px;

  border: none;

  border-radius: 10px;

  background: #713cff;

  color: white;

  font-size: 16px;

  font-weight: bold;

}

button:active {

  background: #4c1d95;

}

#status {

  color: #a879ff;

  margin: 15px;

  min-height: 24px;

}

</style>

</head>

<body>

<h1>GOKU MODE</h1>

<p>INSTANT TRANSMISSION</p>

<canvas id="view" width="640" height="480"></canvas>

<video id="camera" autoplay playsinline muted

style="display:none"></video>

<canvas id="background" width="640" height="480"

style="display:none"></canvas>

<button id="start">START CAMERA</button>

<button id="capture">CAPTURE EMPTY BACKGROUND</button>

<button id="reset">RESET</button>

<p id="status">Press START CAMERA to begin.</p>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("camera");

const canvas = document.getElementById("view");

const ctx = canvas.getContext("2d");

const backgroundCanvas = document.getElementById("background");

const backgroundCtx = backgroundCanvas.getContext("2d");

const statusText = document.getElementById("status");

let hands;

let running = false;

let backgroundReady = false;

let processing = false;
  
let teleportUntil = 0;

let previousGesture = false;

function say(message) {

  statusText.textContent = message;

}

function drawFrame() {

  ctx.clearRect(0, 0, 640, 480);

  if (Date.now() < teleportUntil && backgroundReady) {

    ctx.drawImage(backgroundCanvas, 0, 0, 640, 480);

    ctx.fillStyle = "rgba(140, 60, 255, 0.25)";

    ctx.fillRect(0, 0, 640, 480);

  } else if (video.readyState >= 2) {

    ctx.save();

    ctx.translate(640, 0);

    ctx.scale(-1, 1);

    ctx.drawImage(video, 0, 0, 640, 480);

    ctx.restore();

  }

}

function checkGesture(results) {

  let gesture = false;

  if (results.multiHandLandmarks &&

      results.multiHandLandmarks.length > 0) {

    const hand = results.multiHandLandmarks[0];

    const indexUp = hand[8].y < hand[6].y;

    const middleUp = hand[12].y < hand[10].y;

    const ringDown = hand[16].y > hand[14].y;

    const pinkyDown = hand[20].y > hand[18].y;

    if (indexUp && middleUp && ringDown && pinkyDown) {

      gesture = true;

    }

  }

  if (gesture && !previousGesture) {

    if (backgroundReady) {

      teleportUntil = Date.now() + 1200;

      say("INSTANT TRANSMISSION!");

    } else {

      say("Capture your empty background first!");

    }

  }

  previousGesture = gesture;

}

async function processFrame() {

  if (!running) return;

  try {

    if (video.readyState >= 2) {

      await hands.send({ image: video });

      drawFrame();

    }

  } catch (error) {

    say("Processing error: " + error.message);

  }

  if (running) {

    requestAnimationFrame(processFrame);

  }

}

async function startCamera() {

  try {

    say("Starting camera...");

    const stream = await navigator.mediaDevices.getUserMedia({

      video: {

        facingMode: "user",

        width: 640,

        height: 480

      },

      audio: false

    });

    video.srcObject = stream;

    await video.play();

    hands = new Hands({

      locateFile: (file) =>

        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

    });

    hands.setOptions({

      maxNumHands: 1,

      modelComplexity: 1,

      minDetectionConfidence: 0.6,

      minTrackingConfidence: 0.6

    });

    hands.onResults(checkGesture);

    running = true;

    say("Camera ready! Capture your empty background.");

    processFrame();

  } catch (error) {

    say("Camera error: " + error.message);

  }

}

function captureBackground() {

  if (!running || video.readyState < 2) {

    say("Start the camera first!");

    return;

  }

  backgroundCtx.save();

  backgroundCtx.translate(640, 0);

  backgroundCtx.scale(-1, 1);

  backgroundCtx.drawImage(video, 0, 0, 640, 480);

  backgroundCtx.restore();

  backgroundReady = true;

  say("Background captured! Show two fingers to teleport.");

}

function resetApp() {

  backgroundReady = false;

  teleportUntil = 0;

  previousGesture = false;

  say("Background reset. Capture it again.");

  drawFrame();

}

document.getElementById("start").addEventListener("click", startCamera);

document.getElementById("capture").addEventListener("click", captureBackground);

document.getElementById("reset").addEventListener("click", resetApp);

</script>

</body>

</html>
