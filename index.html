

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>GOKU MODE 5.0</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  padding: 20px;

  background: #050509;

  color: white;

  font-family: Arial, sans-serif;

  text-align: center;

}

h1 {

  font-size: 40px;

  letter-spacing: 5px;

  text-shadow: 0 0 12px white, 0 0 28px #aaa;

  margin-bottom: 5px;

}

.subtitle {

  color: #ccc;

  letter-spacing: 6px;

  font-size: 11px;

}

.canvas-box {

  position: relative;

  width: 100%;

  max-width: 640px;

  margin: 25px auto;

  padding: 5px;

  border: 1px solid white;

  border-radius: 12px;

  box-shadow: 0 0 12px #ffffff55;

  animation: glow 3s ease-in-out infinite alternate;

}

@keyframes glow {

  from { box-shadow: 0 0 5px #ffffff33; }

  to { box-shadow: 0 0 19px #ffffffaa; }

}

canvas {

  display: block;

  width: 100%;

  height: auto;

  border-radius: 7px;

  background: #111;

}

.hud {

  position: absolute;

  inset: 12px;

  z-index: 3;

  pointer-events: none;

  background:

    linear-gradient(white,white) top left / 34px 2px no-repeat,

    linear-gradient(white,white) top left / 2px 34px no-repeat,

    linear-gradient(white,white) top right / 34px 2px no-repeat,

    linear-gradient(white,white) top right / 2px 34px no-repeat,

    linear-gradient(white,white) bottom left / 34px 2px no-repeat,

    linear-gradient(white,white) bottom left / 2px 34px no-repeat,

    linear-gradient(white,white) bottom right / 34px 2px no-repeat,

    linear-gradient(white,white) bottom right / 2px 34px no-repeat;

  opacity: .85;

}

video { display: none; }

button {

  display: block;

  width: 100%;

  max-width: 320px;

  margin: 13px auto;

  padding: 16px;

  border: 1px solid white;

  border-radius: 9px;

  background: #101014;

  color: white;

  font-weight: bold;

  letter-spacing: 2px;

  transition: .2s;

}

button:active { transform: scale(.97); }

button:disabled { opacity: .5; }

#status {

  min-height: 25px;

  color: #ddd;

  font-size: 13px;

  letter-spacing: 1px;

}

.footer {

  color: #777;

  font-size: 10px;

  letter-spacing: 4px;

  margin-top: 25px;

}

</style>

</head>

<body>

<h1>GOKU MODE</h1>

<p class="subtitle">INSTANT TRANSMISSION</p>

<div class="canvas-box">

  <canvas id="view" width="640" height="480"></canvas>

  <div class="hud"></div>

</div>

<video id="camera" autoplay playsinline muted></video>

<button id="start">START CAMERA</button>

<button id="capture">CAPTURE BACKGROUND</button>

<button id="reset">RESET</button>

<p id="status">SYSTEM READY — PRESS START</p>

<p class="footer">POWER • FOCUS • TELEPORT</p>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js"></script>

<script>

const video = document.getElementById("camera");

const canvas = document.getElementById("view");

const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");

const W = 640;

const H = 480;

let stream = null;

let running = false;

let hands = null;

let segmentation = null;

let handBusy = false;

let segmentationBusy = false;

let frameCount = 0;

let backgroundCanvas = null;

let backgroundReady = false;

const maskCanvas = document.createElement("canvas");

maskCanvas.width = W;

maskCanvas.height = H;

const maskCtx = maskCanvas.getContext("2d");

const subjectCanvas = document.createElement("canvas");

subjectCanvas.width = W;

subjectCanvas.height = H;

const subjectCtx = subjectCanvas.getContext("2d");

const outlineCanvas = document.createElement("canvas");

outlineCanvas.width = W;

outlineCanvas.height = H;

const outlineCtx = outlineCanvas.getContext("2d");

let hasMask = false;

let previousGesture = false;

let effectStart = null;

function say(message) {

  statusText.textContent = message;

}

function smooth(t) {

  t = Math.max(0, Math.min(1, t));

  return t * t * (3 - 2 * t);

}

// BODY SEGMENTATION

function onSegmentation(results) {

  maskCtx.clearRect(0, 0, W, H);

  maskCtx.drawImage(results.segmentationMask, 0, 0, W, H);

  // Extract the person from the camera.

  subjectCtx.clearRect(0, 0, W, H);

  subjectCtx.globalCompositeOperation = "source-over";

  subjectCtx.drawImage(video, 0, 0, W, H);

  subjectCtx.globalCompositeOperation = "destination-in";

  subjectCtx.drawImage(maskCanvas, 0, 0);

  subjectCtx.globalCompositeOperation = "source-over";

  // Expand the mask to create an outline.

  outlineCtx.clearRect(0, 0, W, H);

  outlineCtx.globalCompositeOperation = "source-over";

  const offsets = [

    [-4,0], [4,0], [0,-4], [0,4],

    [-3,-3], [3,-3], [-3,3], [3,3],

    [-6,0], [6,0], [0,-6], [0,6]

  ];

  offsets.forEach(([x,y]) => {

    outlineCtx.drawImage(maskCanvas, x, y);

  });

  // Make the expanded mask white.

  outlineCtx.globalCompositeOperation = "source-in";

  outlineCtx.fillStyle = "white";

  outlineCtx.fillRect(0, 0, W, H);

  // Remove the inside, leaving the outside border.

  outlineCtx.globalCompositeOperation = "destination-out";

  outlineCtx.drawImage(maskCanvas, 0, 0);

  outlineCtx.globalCompositeOperation = "source-over";

  hasMask = true;

}

// WHITE ENERGY EFFECT — NO SPINNING CIRCLES

function drawEnergy(time) {

  ctx.save();

  ctx.globalCompositeOperation = "lighter";

  // Initial teleport flash.

  if (time < 250) {

    const flash = 0.8 * (1 - time / 250);

    ctx.fillStyle = `rgba(255,255,255,${flash})`;

    ctx.fillRect(0, 0, W, H);

  }

  // Fast horizontal energy streaks.

  for (let i = 0; i < 14; i++) {

    const progress = ((time * 0.0015 + i * 0.13) % 1);

    const y = (i * 37 + 40) % H;

    const x = progress * W;

    ctx.beginPath();

    ctx.moveTo(x, y);

    ctx.lineTo(x - 65, y + 8);

    ctx.strokeStyle = `rgba(255,255,255,${1-progress})`;

    ctx.lineWidth = 2;

    ctx.shadowColor = "white";

    ctx.shadowBlur = 14;

    ctx.stroke();

  }

  // Fading energy particles.

  for (let i = 0; i < 28; i++) {

    const progress = ((time * 0.0007 + i * 0.037) % 1);

    const x = (i * 83 + progress * 100) % W;

    const y = (i * 47 + progress * 75) % H;

    ctx.fillStyle = `rgba(255,255,255,${1-progress})`;

    ctx.beginPath();

    ctx.arc(x, y, 1 + progress * 3, 0, Math.PI * 2);

    ctx.fill();

  }

  // Reappearance flash.

  if (time > 3650 && time < 3900) {

    const flash = 0.55 * (1 - (time - 3650) / 250);

    ctx.fillStyle = `rgba(255,255,255,${flash})`;

    ctx.fillRect(0, 0, W, H);

  }

  ctx.restore();

}

// CAMERA AND TELEPORT DRAWING

function drawFrame(now) {

  if (video.readyState < 2) return;

  ctx.clearRect(0, 0, W, H);

  let time = -1;

  if (effectStart !== null) {

    time = now - effectStart;

    if (time > 4400) {

      effectStart = null;

      time = -1;

      say("READY — SHOW TWO FINGERS");

    }

  }

  ctx.save();

  ctx.translate(W, 0);

  ctx.scale(-1, 1);

  if (time >= 0 && backgroundReady) {

    // Empty background stays visible.

    ctx.drawImage(backgroundCanvas, 0, 0, W, H);

    if (hasMask) {

      let opacity;

      if (time < 700) {

        opacity = 1 - smooth(time / 700);

      } else if (time < 3700) {

        opacity = 0;

      } else {

        opacity = smooth((time - 3700) / 700);

      }

      // Glowing white body outline.

      ctx.save();

      ctx.globalAlpha = opacity;

      ctx.shadowColor = "white";

      ctx.shadowBlur = 24;

      ctx.drawImage(outlineCanvas, 0, 0);

      ctx.shadowBlur = 0;

      ctx.drawImage(outlineCanvas, 0, 0);

      ctx.restore();

      // Person cutout.

      ctx.save();

      ctx.globalAlpha = opacity;

      ctx.drawImage(subjectCanvas, 0, 0);

      ctx.restore();

    }

  } else {

    ctx.drawImage(video, 0, 0, W, H);

  }

  ctx.restore();

  if (time >= 0) {

    drawEnergy(time);

  }

}

// TWO-FINGER GESTURE

function checkGesture(results) {

  let gesture = false;

  if (

    results.multiHandLandmarks &&

    results.multiHandLandmarks.length > 0

  ) {

    const hand = results.multiHandLandmarks[0];

    const indexUp = hand[8].y < hand[6].y;

    const middleUp = hand[12].y < hand[10].y;

    const ringDown = hand[16].y > hand[14].y;

    const pinkyDown = hand[20].y > hand[18].y;

    gesture = indexUp && middleUp && ringDown && pinkyDown;

  }

  if (gesture && !previousGesture) {

    if (backgroundReady && hasMask && effectStart === null) {

      effectStart = performance.now();

      say("INSTANT TRANSMISSION!");

    } else if (!backgroundReady) {

      say("CAPTURE YOUR BACKGROUND FIRST");

    } else if (!hasMask) {

      say("WAITING FOR BODY DETECTION...");

    }

  }

  previousGesture = gesture;

}

// HAND DETECTION

async function detectHands() {

  if (!running || !hands || handBusy) return;

  handBusy = true;

  try {

    await hands.send({ image: video });

  } catch (error) {

    console.log("Hand detection:", error);

  }

  handBusy = false;

}

// PERSON DETECTION

async function detectPerson() {

  if (!running || !segmentation || segmentationBusy) return;

  segmentationBusy = true;

  try {

    await segmentation.send({ image: video });

  } catch (error) {

    console.log("Person detection:", error);

  }

  segmentationBusy = false;

}

// MAIN ANIMATION

function animate(now) {

  if (!running) return;

  drawFrame(now);

  frameCount++;

  if (frameCount % 2 === 0) {

    detectPerson();

  }

  if (frameCount % 4 === 0) {

    detectHands();

  }

  requestAnimationFrame(animate);

}

// START CAMERA

async function startCamera() {

  if (running) return;

  document.getElementById("start").disabled = true;

  try {

    say("STARTING CAMERA...");

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {

        facingMode: "user",

        width: { ideal: 640 },

        height: { ideal: 480 }

      }

    });

    video.srcObject = stream;

    await video.play();

    say("LOADING BODY DETECTION...");

    segmentation = new SelfieSegmentation({

      locateFile: file =>

        "https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/" + file

    });

    segmentation.setOptions({

      modelSelection: 1

    });

    segmentation.onResults(onSegmentation);

    say("LOADING HAND DETECTION...");

    hands = new Hands({

      locateFile: file =>

        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/" + file

    });

    hands.setOptions({

      maxNumHands: 1,

      modelComplexity: 0,

      minDetectionConfidence: 0.6,

      minTrackingConfidence: 0.6

    });

    hands.onResults(checkGesture);

    running = true;

    say("SYSTEM READY — CAPTURE BACKGROUND");

    requestAnimationFrame(animate);

  } catch (error) {

    say("ERROR: " + error.message);

    document.getElementById("start").disabled = false;

    if (stream) {

      stream.getTracks().forEach(track => track.stop());

      stream = null;

    }

  }

}

// CAPTURE BACKGROUND

function captureBackground() {

  if (!running || video.readyState < 2) {

    say("START CAMERA FIRST");

    return;

  }

  backgroundCanvas = document.createElement("canvas");

  backgroundCanvas.width = W;

  backgroundCanvas.height = H;

  const bgCtx = backgroundCanvas.getContext("2d");

  bgCtx.drawImage(video, 0, 0, W, H);

  backgroundReady = true;

  effectStart = null;

  say("BACKGROUND LOCKED — READY TO TELEPORT");

}

// RESET

function resetApp() {

  backgroundCanvas = null;

  backgroundReady = false;

  effectStart = null;

  previousGesture = false;

  say("RESET — CAPTURE BACKGROUND AGAIN");

}

document.getElementById("start")

  .addEventListener("click", startCamera);

document.getElementById("capture")

  .addEventListener("click", captureBackground);

document.getElementById("reset")

  .addEventListener("click", resetApp);

</script>

</body>

</html>
